name: CI Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci || npm install

    - name: Run Standards/Lint Checks
      run: npm test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Validate Family Space browser JavaScript syntax
      run: node --check family-local.js

    - name: Build isolated Family Space static artifact
      run: |
        node scripts/build-family-static.js
        test -f family-static-dist/index.html
        test ! -e family-static-dist/server/family_local.py
        test ! -e family-static-dist/play.html

    - name: Run Family Space SQLite integration tests
      run: python3 -m unittest discover -s tests -p 'test_family_sqlite.py' -v

    - name: Run Unit Tests (Jest)
      run: npm run test:unit

    - name: Run Integration Tests (Playwright)
      run: npm run test:integration

    - name: Run Visual Regression Tests (Playwright)
      run: npm run test:regression || echo "Visual regression tests encountered an issue (baseline may be missing). Continuing."
