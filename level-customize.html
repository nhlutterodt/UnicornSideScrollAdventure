<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Customization Studio</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/level-customize.css">
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>

    <main class="studio-container" id="studioContainer">
        <!-- Back Button -->
        <a href="index.html" class="exit-link">&larr; Exit Studio</a>

        <!-- Preview Section -->
        <section class="preview-section">
            <h1 class="preview-title">LEVEL PREVIEW</h1>
            
            <div class="level-preview" id="levelPreview">
                <!-- SVG Preview window for the level -->
                <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="level-svg">
                    <defs>
                        <!-- Gradients for backgrounds -->
                        <linearGradient id="bg-day" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#87CEEB" stop-opacity="1" />
                            <stop offset="100%" stop-color="#E0F7FA" stop-opacity="1" />
                        </linearGradient>
                        <linearGradient id="bg-night" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0d1137" stop-opacity="1" />
                            <stop offset="100%" stop-color="#2a2a72" stop-opacity="1" />
                        </linearGradient>
                        <linearGradient id="bg-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ff512f" stop-opacity="1" />
                            <stop offset="100%" stop-color="#dd2476" stop-opacity="1" />
                        </linearGradient>
                    </defs>

                    <!-- Background Layer -->
                    <rect id="previewBg" x="0" y="0" width="400" height="300" fill="url(#bg-day)" />

                    <!-- Distant Elements (Mountains/Clouds) -->
                    <g id="previewDistant" opacity="0.6"></g>

                    <!-- Ground/Platform Layer -->
                    <g id="previewGround" transform="translate(0, 220)">
                        <path d="M0,0 L400,0 L400,80 L0,80 Z" fill="#4CAF50" />
                    </g>

                    <!-- Obstacles Layer -->
                    <g id="previewObstacles" transform="translate(100, 180)">
                    </g>

                    <!-- Collectibles Layer -->
                    <g id="previewCollectibles" transform="translate(200, 150)">
                        <circle cx="20" cy="20" r="15" fill="gold" />
                    </g>
                </svg>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="controls-section">
            <h2 class="controls-header">Level Designer</h2>

            <!-- Background Style -->
            <div class="control-group">
                <label class="control-label">Atmosphere</label>
                <div class="accessory-grid">
                    <div class="acc-item active" data-bg="day">
                        <span class="acc-icon">☀️</span>
                        <span class="acc-name">Day</span>
                    </div>
                    <div class="acc-item" data-bg="night">
                        <span class="acc-icon">🌙</span>
                        <span class="acc-name">Night</span>
                    </div>
                    <div class="acc-item" data-bg="sunset">
                        <span class="acc-icon">🌆</span>
                        <span class="acc-name">Sunset</span>
                    </div>
                </div>
            </div>

            <!-- Surface Type -->
            <div class="control-group">
                <label class="control-label">Surface Bounciness</label>
                <div class="accessory-grid">
                    <div class="acc-item active" data-surface="normal">
                        <span class="acc-icon">👟</span>
                        <span class="acc-name">Normal</span>
                    </div>
                    <div class="acc-item" data-surface="slippery">
                        <span class="acc-icon">🧊</span>
                        <span class="acc-name">Slippery</span>
                    </div>
                    <div class="acc-item" data-surface="bouncy">
                        <span class="acc-icon">🎾</span>
                        <span class="acc-name">Bouncy</span>
                    </div>
                </div>
            </div>

            <!-- World Decorations -->
            <div class="control-group">
                <label class="control-label">World Flora</label>
                <div class="accessory-grid">
                    <div class="acc-item active" data-flora="none">
                        <span class="acc-icon">🏜️</span>
                        <span class="acc-name">None</span>
                    </div>
                    <div class="acc-item" data-flora="flowers">
                        <span class="acc-icon">🌸</span>
                        <span class="acc-name">Flowers</span>
                    </div>
                    <div class="acc-item" data-flora="mushrooms">
                        <span class="acc-icon">🍄</span>
                        <span class="acc-name">Mushrooms</span>
                    </div>
                </div>
            </div>

            <!-- Celestial Wonders -->
            <div class="control-group">
                <label class="control-label">Sky Gravity</label>
                <div class="accessory-grid">
                    <div class="acc-item active" data-sky="clouds">
                        <span class="acc-icon">☁️</span>
                        <span class="acc-name">Clouds</span>
                    </div>
                    <div class="acc-item" data-sky="stars">
                        <span class="acc-icon">🌠</span>
                        <span class="acc-name">Stars</span>
                    </div>
                    <div class="acc-item" data-sky="dragons">
                        <span class="acc-icon">🐉</span>
                        <span class="acc-name">Dragons</span>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button type="button" class="btn-magic btn-secondary" id="randomizeBtn">Randomize</button>
                <button type="button" class="btn-magic" id="saveBtn">Save Level</button>
            </div>
        </section>
    </main>

    <!-- Bootstrap the Level Customizer Studio -->
    <script type="module" src="./js/level-customize.js"></script>
</body>
</html>
